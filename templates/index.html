<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Monitoramento via Ping</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static',filename='images/LogoIFB.png') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/styles.css') }}">
</head>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>
    <header>
        <h2 style="text-align:center;">Monitoramento via Ping</h2>


    </header>

    <pre id="resultado"></pre>

    <div id="CaixText">
        <input type="text" id="host" placeholder="Digite um IP ou hostname">
        <input type="number" id="temporizador" placeholder="ms" value="500">
        <button onclick="Tabela()">Ping</button>
    </div>
    <div id="container-bg">
    </div>

    <script>
        var contador = 0;
        const pesquisas = {};

        function alternarPesquisa(id) {

            const pesquisa = pesquisas[id];

            if (!pesquisa) return;

            const botao = document.getElementById(`btn-${id}`);
            const excluir = document.getElementById(`excluir-${id}`);

            if (pesquisa.executando) {

                pesquisa.executando = false;

                botao.innerHTML = "Continuar";
                excluir.style.display = "inline-block";

            } else {

                pesquisa.executando = true;

                botao.innerHTML = "Parar";
                excluir.style.display = "none";
            }
        }

        function excluirPesquisa(id) {

            delete pesquisas[id];

            document.getElementById(`sessao-${id}`).remove();
        }

        function Tabela() {
            const container = document.getElementById('container-bg');
            const novoConteudo = `
                <div id="sessao-${contador}" class="sessao">
                    <div class="grafico">
                        <p style = 'color: #231F20; text-align: center; font-weight: 900;'>
                            ${document.getElementById("host").value.trim()}
                             - 
                            ${document.getElementById("temporizador").value.trim()}  
                             ms  
                        </p>
                        <canvas id="myChart${contador}"></canvas>

                    </div>

                    <div class="dados">

                        <div class="caixa" style = 'border-left: 6px solid #4E9D30'>
                            <p style = 'color: #231F20; text-align: center; font-weight: 900;'>Latência:</p>
                            <p id="rttUltimo-${contador}" style = 'color: #231F20; text-align: center; font-weight: 900;'></p>
                        </div>

                        <div class="caixa" style = 'border-left: 6px solid #4E9D30'>
                            <p style = 'color: #231F20; text-align: center; font-weight: 900;'>Latência Média:</p>
                            <p id="rtt-${contador}" style = 'color: #231F20; text-align: center; font-weight: 900;'></p>
                        </div>

                        <div class="caixa">
                            <p style = 'color: #231F20; text-align: center; font-weight: 900;'>Jitter:</p>
                            <p id="jitter-${contador}" style = 'color: #231F20; text-align: center; font-weight: 900;'></p>
                        </div>

                        <div class="caixa">
                            <p style = 'color: #231F20; text-align: center; font-weight: 900;'>Jitter Médio:</p>
                            <p id="jitterMedio-${contador}" style = 'color: #231F20; text-align: center; font-weight: 900;'></p>
                        </div>

                        <div class="caixa" style = 'border-left: 6px solid #231F20'>
                            <p style = 'color: #231F20; text-align: center; font-weight: 900;'>Total de Pacotes</p>
                            <p id="pacotesTotal-${contador}" style = 'color: #231F20; text-align: center; font-weight: 900;'></p>
                        </div>

                        <div class="caixa" style = 'border-left: 6px solid #231F20'>
                            <p style = 'color: #231F20; text-align: center; font-weight: 900;'>Pacotes Perdidos</p>
                            <p id="pacotesPerdidos-${contador}" style = 'color: #231F20; text-align: center; font-weight: 900;'></p>
                        </div>

                        <div class="caixa" style = 'border-left: 6px solid #231F20'>
                            <p style = 'color: #231F20; text-align: center; font-weight: 900;'>Perda Percentual</p>
                            <p id="perda-${contador}" style = 'color: #231F20; text-align: center; font-weight: 900;'></p>
                        </div>

                            <div class="botoes">

                            <button id="btn-${contador}" onclick="alternarPesquisa(${contador})">
                                Parar
                            </button>

                            <button id="excluir-${contador}" onclick="excluirPesquisa(${contador})" style="display:none;background:#A6192E;">
                                Excluir
                            </button>

                    </div>
                    </div>

                </div>
            `;

            const host = document.getElementById("host").value.trim();
            if (!host) {
                alert("Informe um IP ou hostname.");
                return
            }

            container.insertAdjacentHTML('beforeend', novoConteudo);

            testar(contador)

            contador++
        }

        function addData(chart, label, newDataArray) {
            chart.data.labels.push(label);

            chart.data.datasets.forEach((dataset, index) => {
                dataset.data.push(newDataArray[index]);
            });

            chart.update();
        }

        function removeData(chart) {
            chart.data.labels.shift();

            chart.data.datasets.forEach((dataset) => {
                dataset.data.shift();
            });

            chart.update();
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function testar(contador) {

            pesquisas[contador] = {
                executando: true
            };

            const xValues = [];
            const yValues_rtt = [];
            const yValues_jit = [];

            const chartname = 'myChart' + contador
            const perdaname = 'perda-' + contador
            const rttname = 'rtt-' + contador
            const rttUltimoname = 'rttUltimo-' + contador
            const jittername = 'jitter-' + contador
            const jitterMedioname = "jitterMedio-" + contador
            const pacotesTotalname = "pacotesTotal-" + contador
            const pacotesPerdidosname = "pacotesPerdidos-" + contador

            var ctx = document.getElementById(chartname);

            var CoolChart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: xValues,

                    datasets: [{
                        label: 'Latência',
                        fill: false,
                        lineTension: 0,
                        backgroundColor: "rgba(80,158,47,1.0)",
                        borderColor: "rgba(80,158,47,1.0)",
                        data: yValues_rtt
                    }, {
                        label: 'Jitter',
                        fill: false,
                        lineTension: 0,
                        backgroundColor: "rgba(166,25,46,1.0)",
                        borderColor: "rgba(166,25,46,1.0)",
                        data: yValues_jit
                    }]
                },
                options: {
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: true },
                        title: {
                            display: false,
                        }
                    }

                }
            });

            const host = document.getElementById("host").value.trim();
            const tempo = document.getElementById("temporizador").value;

            let perda_pacotes = 0
            let total_pacotes = 0
            let last_diff = 0
            let soma_ping = 0
            let soma_jitter = 0
            let media_jitter = 0
            let media_ping = 0
            let pingUltimo = 0
            let perda_percentual = 0
            let dados

            while (true) {

                if (!pesquisas[contador]) {
                    break;
                }

                if (!pesquisas[contador].executando) {
                    await sleep(300);
                    continue;
                }

                if (xValues.length == 20) {
                    removeData(CoolChart)
                }

                try {
                    total_pacotes = total_pacotes + 1

                    const resposta = await fetch(`/ping/${encodeURIComponent(host)}`);

                    if (!resposta.ok) {
                        perda_pacotes = perda_pacotes + 1
                        dados = {
                            rtt_ms: 0
                        };
                        last_diff = 0

                        media_ping =
                            total_pacotes > 0
                                ? soma_ping / total_pacotes
                                : 0;
                        media_ping = media_ping.toFixed(2)
                        pingUltimo = dados.rtt_ms
                        pingUltimo = pingUltimo.toFixed(2)

                        if (xValues.length == 0) {
                            last_diff = dados.rtt_ms
                        }

                        let jitter = Math.abs((dados.rtt_ms - last_diff))
                        soma_jitter = soma_jitter + jitter;
                        jitter = jitter.toFixed(2)
                        media_jitter =
                            total_pacotes > 0
                                ? soma_jitter / total_pacotes
                                : 0;
                        media_jitter = media_jitter.toFixed(2)

                        perda_percentual = perda_pacotes / total_pacotes * 100
                        perda_percentual = perda_percentual.toFixed(2)

                        addData(CoolChart, total_pacotes, [0, last_diff]);

                        document.getElementById(rttname).innerHTML = media_ping + ' ms';
                        document.getElementById(rttUltimoname).innerHTML = pingUltimo + ' ms';
                        document.getElementById(jittername).innerHTML = jitter + ' ms';
                        document.getElementById(jitterMedioname).innerHTML = media_jitter + ' ms';
                        document.getElementById(pacotesTotalname).innerHTML = total_pacotes;
                        document.getElementById(pacotesPerdidosname).innerHTML = perda_pacotes;
                        document.getElementById(perdaname).innerHTML = perda_percentual + '%';

                        throw new Error(`O servidor retornou status ${resposta.status}`);
                    }

                    dados = await resposta.json();

                    if (dados.rtt_ms == null) {
                        perda_pacotes = perda_pacotes + 1
                        dados = {
                            rtt_ms: 0
                        };
                        last_diff = 0

                        media_ping =
                            total_pacotes > 0
                                ? soma_ping / total_pacotes
                                : 0;
                        media_ping = media_ping.toFixed(2)
                        pingUltimo = dados.rtt_ms
                        pingUltimo = pingUltimo.toFixed(2)

                        if (xValues.length == 0) {
                            last_diff = dados.rtt_ms
                        }
                        let jitter = Math.abs((dados.rtt_ms - last_diff))
                        soma_jitter = soma_jitter + jitter;

                        jitter = jitter.toFixed(2)
                        media_jitter =
                            total_pacotes > 0
                                ? soma_jitter / total_pacotes
                                : 0;
                        media_jitter = media_jitter.toFixed(2)
                        perda_percentual = perda_pacotes / total_pacotes * 100
                        perda_percentual = perda_percentual.toFixed(2)

                        addData(CoolChart, total_pacotes, [0, last_diff]);

                        document.getElementById(rttname).innerHTML = media_ping + ' ms';
                        document.getElementById(rttUltimoname).innerHTML = pingUltimo + ' ms';
                        document.getElementById(jittername).innerHTML = jitter + ' ms';
                        document.getElementById(jitterMedioname).innerHTML = media_jitter + ' ms';
                        document.getElementById(pacotesTotalname).innerHTML = total_pacotes;
                        document.getElementById(pacotesPerdidosname).innerHTML = perda_pacotes;
                        document.getElementById(perdaname).innerHTML = perda_percentual + '%';
                        throw new Error(`TimedOut`);
                    }

                    soma_ping = soma_ping + dados.rtt_ms

                    if (xValues.length == 0) {
                        last_diff = dados.rtt_ms
                    }

                    let jitter = Math.abs((dados.rtt_ms - last_diff))
                    soma_jitter = soma_jitter + jitter;

                    jitter = jitter.toFixed(2)
                    media_jitter =
                        total_pacotes > 0
                            ? soma_jitter / total_pacotes
                            : 0;
                    media_jitter = media_jitter.toFixed(2)

                    last_diff = dados.rtt_ms

                    media_ping =
                        total_pacotes > 0
                            ? soma_ping / total_pacotes
                            : 0;
                    media_ping = media_ping.toFixed(2)
                    pingUltimo = dados.rtt_ms
                    pingUltimo = pingUltimo.toFixed(2)

                    perda_percentual = perda_pacotes / total_pacotes * 100
                    perda_percentual = perda_percentual.toFixed(2)

                    addData(CoolChart, total_pacotes, [dados.rtt_ms, jitter]);

                    document.getElementById(jittername).innerHTML = jitter + ' ms';
                    document.getElementById(jitterMedioname).innerHTML = media_jitter + ' ms';
                    document.getElementById(rttname).innerHTML = media_ping + ' ms';
                    document.getElementById(rttUltimoname).innerHTML = pingUltimo + ' ms';
                    document.getElementById(pacotesTotalname).innerHTML = total_pacotes;
                    document.getElementById(pacotesPerdidosname).innerHTML = perda_pacotes;
                    document.getElementById(perdaname).innerHTML = perda_percentual + '%';

                } catch (erro) {
                    document.getElementById("resultado").textContent = "Falha na requisição: " + erro.message;
                }

                await sleep(tempo);

            }
        }
    </script>
</body>

<footer>
    <div style="display: flex; justify-content: center; position: relative;
    height: 100px; bottom: 70%;">
        <div style="margin-top: 20px; border: 1px black; border-style: solid none none none;
        text-align:center; width: 60%;">
            <p style="margin-top: 10px;">
                Feito por: Arthur Carlos Neuhauss & Thiago Vinicius da Silva Rezende
                <br>
                Estudantes do Instituto Federal de Brasília
            </p>
        </div>
    </div>
</footer>

</html>
